[alembic]
script_location = alembic
prepend_sys_path = .
# 必须显式声明：否则新版 Alembic 会发 DeprecationWarning 并回退到按空格/逗号/冒号
# 切分的旧行为；本项目 pytest 开了 filterwarnings=error，会直接失败
path_separator = os
version_path_separator = os
# 迁移文件名用 0001_xxx.py 形式（docs/03 §1.2 / docs/04 §6.2）
file_template = %%(rev)s_%%(slug)s

# URL 不写在这里：由 env.py 从 DATABASE_URL_MIGRATION（迁移账号）读取，
# 避免把连接串与密码写进仓库（docs/11 §2）。
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
