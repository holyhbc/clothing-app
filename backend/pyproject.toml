[project]
name = "garment-erp-backend"
version = "0.1.0"
description = "服装厂 ERP 后端：FastAPI + SQLAlchemy 2.0 async + PostgreSQL 16"
# 锁定 3.12：与 ruff target-version=py312、镜像 python:3.12-slim 一致（docs/11 §4）
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.17",
    "redis>=5.2",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-openpyxl>=3.1",
]

[tool.uv]
package = false

# ---- ruff（docs/03-代码规范.md §1.6，配置照抄，不得放宽）----
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RUF", "ANN", "S", "BLE"]
ignore = ["E501"]

# RUF001/002/003 会把**中文全角标点**判为"易混淆字符"（如 `（` 与 `(` 混淆）。
# 本项目语言口径为「文档与业务字段中文」（AGENTS.md §0），面向工厂用户的提示文案
# 必须用全角标点，因此把中文常用全角符号列入白名单，而不是关闭 RUF 规则。
# ⚠️ 只放宽"字符混淆"这一项判定，RUF 其余检查项（以及 select 里的其他规则）全部保持开启；
#    若将来要改这条口径，需先改 docs/03 §1.6 并写 ADR（docs/02 §3：闸门不允许被配置放宽）。
allowed-confusables = [
    "，", "。", "；", "：", "、", "（", "）", "【", "】", "《", "》", "「", "」",
    "‘", "’", "“", "”", "—", "…", "·",
    # 技术文档常用符号：乘号（款号×工序）、箭头、区间与箭头分隔
    "×", "→", "←", "≥", "≤", "≠", "±", "∈",
]

# FastAPI 的依赖声明就是 `Depends()` 写在参数默认值里（docs/07 §3.1 的规范示例
# 本身如此），B008 会把它误报成"可变默认值调用"。这里用 bugbear 的官方配置项
# 声明这些调用是"不可变安全的"，而不是粗暴关掉 B008 —— 真正的可变默认值 bug
# 仍然会被拦住。
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# S101: 测试里允许 assert
# ANN : 测试函数签名不必全标注
# S106: 测试**必须**喂入形似密钥的假值来验证脱敏（如 test_logging 的 password=...），
#       否则无法验证 docs/11 §8.1 的"禁止打印密码/token"。豁免范围仅限 tests/**。
"tests/**" = ["S101", "ANN", "S106"]
# ANN : 迁移脚本由 Alembic 生成模板，签名不强制标注
"alembic/**" = ["ANN"]
# T201: CLI 入口的**人机界面就是 stdout**（运维要看到"新增了多少条""是否一致"），
#       业务代码里的 print 才必须换成结构化 logger（docs/03 §1.1 第 10 条）。
#       豁免范围仅限 app/cli/**，应用代码仍禁用 print。
"app/cli/**" = ["T201"]
# T201: E2E 种子是 **CLI 入口**（`python -m tests.e2e_seed`），人机界面就是 stdout ——
#       跑它的人要看到"款号就绪了没有 / 哪条业务规则被拒了"。与 app/cli/** 同一条理由，
#       所以豁免；pytest 用例仍然受 S101/ANN 约束。
"tests/e2e_seed.py" = ["T201"]

# ---- mypy（docs/03 §1.6：strict = true）----
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "aiokafka.*"]
ignore_missing_imports = true

# ---- pytest（docs/10-测试规范.md §2.2）----
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pwdlib.*",
]

# ---- 覆盖率（docs/10-测试规范.md §8，阈值不得下调）----
[tool.coverage.run]
source = ["app"]
omit = ["*/migrations/*", "app/workers/*", "app/main.py"]

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
