[project]
name = "garment-erp-backend"
version = "0.1.0"
description = "服装厂 ERP 后端：FastAPI + SQLAlchemy 2.0 async + PostgreSQL 16"
# 锁定 3.12：与 ruff target-version=py312、镜像 python:3.12-slim 一致（docs/11 §4）
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.17",
    "redis>=5.2",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

# ---- ruff（docs/03-代码规范.md §1.6，配置照抄，不得放宽）----
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RUF", "ANN", "S", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
"alembic/**" = ["ANN"]

# ---- mypy（docs/03 §1.6：strict = true）----
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "aiokafka.*"]
ignore_missing_imports = true

# ---- pytest（docs/10-测试规范.md §2.2）----
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pwdlib.*",
]

# ---- 覆盖率（docs/10-测试规范.md §8，阈值不得下调）----
[tool.coverage.run]
source = ["app"]
omit = ["*/migrations/*", "app/workers/*", "app/main.py"]

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
