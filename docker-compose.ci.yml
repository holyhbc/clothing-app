# CI / 本地闸门编排（docs/02 §3 五道闸门的执行环境）
#
# 与生产编排的差别：**允许 build:**，且额外提供一次性任务容器（migrate-check / test）。
# 生产绝不使用本文件（docs/11 §3 禁令 1）。

name: garment-erp-ci

x-ci-env: &ci-env
  APP_ENV: test
  # 测试环境全量重建，不复用生产数据（docs/11 §1 铁律 1）
  DATABASE_URL: postgresql+asyncpg://erp_app:ci-only-not-a-secret@postgres:5432/garment_erp_test
  DATABASE_URL_MIGRATION: postgresql+asyncpg://erp_ddl:ci-only-not-a-secret@postgres:5432/garment_erp_test
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
  JWT_EXPIRE_MINUTES: "15"

# ⚠️ 三个闸门服务**必须共用同一个镜像 tag**。
#
# 踩过的坑：原先三个服务各自写 `build:`，Compose 会给每个服务建**各自的镜像**
# （garment-erp-ci-lint / -test / -migrate-check）。于是 `docker compose build test lint`
# 之后，`migrate-check` 用的还是上一次构建的镜像 —— 表现为莫名其妙的
# "Can't locate revision identified by '0003'"：明明刚加了迁移，闸门却说找不到。
# 根因是"构建集合"与"运行集合"不一致，而这类失败每次都长得像代码 bug。
#
# 现在显式声明同一个 image tag，Compose 只构建一次、三个服务指向同一份镜像，
# 从根上消除镜像分叉。
x-gate-image: &gate-image
  image: garment-erp-ci-backend:dev
  build:
    context: .
    dockerfile: docker/backend/Dockerfile
    target: dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # 引导超管刻意用 postgres，**不用 erp_app**：否则 erp_app 会是超级用户，
      # "应用账号无 DELETE 权限"在测试环境失效，权限测试全部失真（docs/04 §6.2.1）
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-only-not-a-secret
      POSTGRES_DB: garment_erp_test
      # 角色初始化脚本读取这三个变量（首次启动时执行一次）
      ERP_DDL_USER: erp_ddl
      ERP_DDL_PASSWORD: ci-only-not-a-secret
      ERP_APP_USER: erp_app
      ERP_APP_PASSWORD: ci-only-not-a-secret
      ERP_DB: garment_erp_test
    volumes:
      # 角色初始化（docs/04 §6.2.1）。只读挂载，容器内不改脚本
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 仅绑定回环，供宿主机直接跑 pytest（开发循环用）；CI 走 compose 网络内的 test 服务
      - "127.0.0.1:15432:5432"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
      - -c
      - timezone=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d garment_erp_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data        # 测试库一次性，不落盘

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- 闸门 1 / 2：lint + typecheck ----
  lint:
    <<: *gate-image
    environment: *ci-env
    command: ["bash", "-c", "ruff check . && ruff format --check . && mypy app"]
    working_dir: /app

  # ---- 闸门 3：单测 + 覆盖率（docs/10 §8 阈值 fail_under=80）----
  test:
    <<: *gate-image
    environment: *ci-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - bash
      - -c
      - "pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80"
    working_dir: /app

  # ---- 闸门 4：迁移往返（up → down → 再 up，docs/04 §6.2）----
  migrate-check:
    <<: *gate-image
    environment: *ci-env
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -c
      - "alembic upgrade head && alembic downgrade -1 && alembic upgrade head && alembic current"
    working_dir: /app

  # ---- 闸门 5：镜像构建（生产 compose 无 build，故在 CI 编排里验证）----
  api-image:
    # runtime 目标单独构建（闸门 5：生产镜像能构建且能 import）
    image: garment-erp-ci-backend:runtime
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: runtime
    environment: *ci-env
    command: ["python", "-c", "import app.main; print('api image import ok')"]

  web-image:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    # 前端镜像的闸门 = **产物真的拷进 runtime 了** + **nginx 配置语法正确**。
    # 只跑 `nginx -t` 不够：它压根不碰静态产物，而历史上真正炸的正是这一步
    # （builder 阶段 install 失败 → dist 根本没生成 → COPY 拿不到）。
    command:
      - sh
      - -c
      - |
        set -e
        test -f /usr/share/nginx/html/index.html   || { echo "缺 PC 端入口 index.html"; exit 1; }
        test -f /usr/share/nginx/mobile/index.html || { echo "缺员工端入口 index.html"; exit 1; }
        nginx -t
        # ⚠️ **光有 nginx -t 不算过**。它只做配置语法与 upstream 解析，
        #    启动期才发生的问题一个都测不到 —— 本仓库已经踩了三次：
        #      ① upstream 主机名解析不到 → 容器直接 Exited(1)
        #      ② 非 root 跑时 /var/cache/nginx 不可写 → mkdir 失败
        #      ③ builder 阶段 install 失败 → dist 压根没生成
        #    所以真起一次 nginx 并探测首页能拿到 200。
        nginx
        # ⚠️ 这里**不能出现任何美元符号**：docker compose 在**解析 yaml 时**就会把
        #    美元符号后面的东西当环境变量替换掉，连注释里的也一样（会打
        #    `The "i" variable is not set` 警告）。第一版探测循环用 shell 变量计数，
        #    结果容器里收到的是 `sh: 20: unknown operand`，循环一次都没执行就判失败 ——
        #    闸门红了，但红的原因跟被测的东西毫无关系。
        #    真要用变量必须写成双美元符号（compose 的转义），这里干脆不用。
        if wget -q -T 3 -t 15 -O /dev/null http://127.0.0.1/; then
          echo "web smoke ok: 首页 200"
          nginx -s quit
          exit 0
        fi
        echo "web smoke 失败：容器没退出，但 80 端口没有响应"
        nginx -s quit || true
        exit 1
    extra_hosts:
      # `nginx -t` 解析 upstream 时会做一次 DNS。`compose run` 不会把 api 服务拉起来，
      # 容器里就没有 `api` 这个主机名 → 配置校验 emerg 失败，
      # 而那个失败与镜像本身无关（运行期 compose 网络里才有 api）。
      # 给个假解析让校验能跑完。
      - "api:127.0.0.1"
