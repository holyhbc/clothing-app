# ERP 网关：静态资源 + /api 反代（docs/11 §3）
# 由 frontend 镜像内置；只对外暴露 80（TLS 由宿主 nginx 或云层终结）

upstream api_upstream {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- 上传上限：Excel 导入单文件 5000 行（docs/05 §9.2）----
    client_max_body_size 20m;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # ---- 健康检查直通（不记 access_log，避免刷屏）----
    location = /healthz {
        access_log off;
        proxy_pass http://api_upstream/readyz;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://api_upstream/readyz;
    }

    # ---- API 反代 ----
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 计件写入要求 P95 < 150ms（docs/00 §6），超时给足但不无限等
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # SSE：/api/v1/events/stream 需要关闭缓冲（docs/05 §8）
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # ---- 员工端 H5（挂 /mobile）----
    location /mobile/ {
        alias /usr/share/nginx/mobile/;
        try_files $uri $uri/ /mobile/index.html;
    }

    # ---- PC 端静态资源 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可长期缓存
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
